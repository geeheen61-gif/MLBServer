<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Prop AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0D1117;
            --surface: #161B22;
            --border: #30363D;
            --text-main: #F0F6FC;
            --text-dim: #8B949E;
            --blue: #58A6FF;
            --red: #F85149;
            --orange: #D29922;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-shell {
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        header {
            padding: 30px 20px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }

        header span {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 2px;
            display: block;
            margin-top: 5px;
        }

        nav {
            display: flex;
            background: var(--surface);
            margin: 10px 20px;
            border-radius: 15px;
            padding: 5px;
            border: 1px solid var(--border);
        }

        .nav-tab {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: var(--text-dim);
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .nav-tab.active {
            background: var(--bg);
            color: var(--text-main);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .nav-tab i { font-size: 1rem; }

        main { padding: 10px 20px 40px; flex: 1; }
        .panel { display: none; }
        .panel.active { display: block; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            margin-top: 10px;
        }

        .field-group { margin-bottom: 20px; }
        
        .field { margin-bottom: 15px; }
        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .input-container {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-container input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
        }

        .switch-row span { font-size: 0.85rem; font-weight: 600; }

        /* Toggle Switch */
        .toggle { position: relative; width: 40px; height: 22px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #30363D; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: var(--blue); }
        input:checked + .slider:before { transform: translateX(18px); }

        .predict-btn {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .predict-btn:active { transform: scale(0.98); }

        /* Results Area */
        .results-container { margin-top: 30px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 15px;
        }

        .stat-label { font-size: 0.6rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; display: block; }
        .stat-value { font-size: 1.2rem; font-weight: 900; }

        .report-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
        }

        .report-header { font-size: 0.8rem; font-weight: 800; color: var(--text-dim); margin-bottom: 15px; letter-spacing: 1px; }
        .report-body { font-size: 0.95rem; line-height: 1.6; color: #E6EDF3; }

        .verdict-box {
            background: rgba(210, 153, 34, 0.1);
            border: 1px solid rgba(210, 153, 34, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .verdict-title { color: var(--orange); font-size: 0.7rem; font-weight: 900; margin-bottom: 10px; letter-spacing: 1px; }
        .verdict-text { font-size: 1.1rem; font-weight: 700; color: #fff; }

        /* Loader */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(5px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px; height: 50px; border: 4px solid var(--border);
            border-top-color: var(--blue); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text { margin-top: 20px; font-weight: 700; font-size: 0.8rem; color: var(--blue); letter-spacing: 2px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-shell">
        <header>
            <h1>DIAMOND PROP AI</h1>
            <span>PRO MLB ANALYTICS</span>
        </header>

        <nav>
            <button class="nav-tab active" data-tab="batsman">
                <i class="fas fa-user"></i>
                <span>BATTER</span>
            </button>
            <button class="nav-tab" data-tab="pitcher">
                <i class="fas fa-baseball"></i>
                <span>PITCHER</span>
            </button>
            <button class="nav-tab" data-tab="ballpark">
                <i class="fas fa-mountain-sun"></i>
                <span>BALLPARK</span>
            </button>
        </nav>

        <main>
            <!-- Batsman Panel -->
            <section id="batsman" class="panel active">
                <div class="card">
                    <div class="field">
                        <label>Batter Name</label>
                        <div class="input-container">
                            <input type="text" id="batter-name" value="Matt Olson">
                        </div>
                    </div>
                    <div class="field">
                        <label>Market Odds</label>
                        <div class="input-container">
                            <input type="number" id="odds" value="250">
                        </div>
                    </div>
                    <div class="field">
                        <label>Pitcher HR/9</label>
                        <div class="input-container">
                            <input type="number" id="hr9" value="1.2" step="0.1">
                        </div>
                    </div>
                    <div class="field">
                        <label>Park Factor</label>
                        <div class="input-container">
                            <input type="number" id="park-factor" value="1.0" step="0.01">
                        </div>
                    </div>
                    <div class="switch-row">
                        <span>Is Home Venue?</span>
                        <label class="toggle">
                            <input type="checkbox" id="is-home" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <button class="predict-btn" id="analyze-batsman" style="background-color: var(--blue)">PREDICT HOME RUN</button>
                </div>
                <div id="batsman-results" class="results-container hidden"></div>
            </section>

            <!-- Pitcher Panel -->
            <section id="pitcher" class="panel">
                <div class="card">
                    <div class="field">
                        <label>Pitcher Name</label>
                        <div class="input-container">
                            <input type="text" id="pitcher-name" value="Jameson Taillon">
                        </div>
                    </div>
                    <button class="predict-btn" id="analyze-pitcher" style="background-color: var(--red)">ANALYZE VULNERABILITY</button>
                </div>
                <div id="pitcher-results" class="results-container hidden"></div>
            </section>

            <!-- Ballpark Panel -->
            <section id="ballpark" class="panel">
                <div class="card">
                    <div class="field">
                        <label>Stadium Name</label>
                        <div class="input-container">
                            <input type="text" id="stadium-name" value="Coors Field">
                        </div>
                    </div>
                    <button class="predict-btn" id="analyze-ballpark" style="background-color: var(--orange)">FETCH BALLPARK DATA</button>
                </div>
                <div id="ballpark-results" class="results-container hidden"></div>
            </section>
        </main>
    </div>

    <!-- Loader -->
    <div id="loader" class="loader-overlay hidden">
        <div class="spinner"></div>
        <p class="loader-text">AI ANALYZING...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.nav-tab');
            const panels = document.querySelectorAll('.panel');
            const loader = document.getElementById('loader');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    panels.forEach(p => p.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(tab.dataset.tab).classList.add('active');
                });
            });

            async function fetchData(url, payload) {
                loader.classList.remove('hidden');
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (data.error) {
                        alert("Error: " + data.error);
                        return null;
                    }
                    return data;
                } catch (e) {
                    alert("Analysis Failed: Check Connection");
                } finally {
                    loader.classList.add('hidden');
                }
            }

            function renderResults(containerId, data, accentColor) {
                const container = document.getElementById(containerId);
                container.classList.remove('hidden');
                
                let statsHtml = '<div class="stat-grid">';
                if (data.metrics) {
                    for (const [key, val] of Object.entries(data.metrics)) {
                        statsHtml += `
                            <div class="stat-card" style="border-bottom: 3px solid ${accentColor}">
                                <span class="stat-label">${key.replace(/_/g, ' ')}</span>
                                <span class="stat-value" style="color: ${accentColor}">${val}</span>
                            </div>`;
                    }
                }
                statsHtml += '</div>';

                const summary = data.summary || "";
                let body = summary;
                let verdictHtml = "";
                const separator = "### OVERALL MATCH PREDICTION ###";
                
                if (summary.includes(separator)) {
                    const parts = summary.split(separator);
                    body = parts[0].trim();
                    verdictHtml = `
                        <div class="verdict-box">
                            <div class="verdict-title">AI PROBABILITY VERDICT</div>
                            <div class="verdict-text">${parts[1].trim()}</div>
                        </div>`;
                }

                container.innerHTML = `
                    ${statsHtml}
                    <div class="report-card">
                        <div class="report-header">INTELLIGENCE REPORT</div>
                        <div class="report-body">${body.replace(/\n/g, '<br>')}</div>
                    </div>
                    ${verdictHtml}
                `;
                container.scrollIntoView({ behavior: 'smooth' });
            }

            document.getElementById('analyze-batsman').addEventListener('click', async () => {
                const results = await fetchData('/predict_batter', {
                    player_name: document.getElementById('batter-name').value,
                    sportsbook_odds: parseFloat(document.getElementById('odds').value),
                    pitcher_hr9: parseFloat(document.getElementById('hr9').value),
                    park_factor: parseFloat(document.getElementById('park-factor').value),
                    is_home: document.getElementById('is-home').checked
                });
                if (results) renderResults('batsman-results', results, '#58A6FF');
            });

            document.getElementById('analyze-pitcher').addEventListener('click', async () => {
                const results = await fetchData('/predict_pitcher', { 
                    pitcher_name: document.getElementById('pitcher-name').value 
                });
                if (results) renderResults('pitcher-results', results, '#F85149');
            });

            document.getElementById('analyze-ballpark').addEventListener('click', async () => {
                const results = await fetchData('/park_history', {
                    stadium_name: document.getElementById('stadium-name').value
                });
                if (results) renderResults('ballpark-results', results, '#D29922');
            });
        });
    </script>
</body>
</html>
